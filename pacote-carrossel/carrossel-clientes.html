<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  .kfv-showcase {
    --kfv-bg: #FFF7EE;
    --kfv-ink: #3B2A20;
    --kfv-coral: #FF6F59;
    --kfv-teal: #2EC4B6;
    --kfv-yellow: #FFC93C;
    padding: 56px 0 64px;
    background: var(--kfv-bg);
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }

  .kfv-showcase__head {
    max-width: 640px;
    margin: 0 auto 36px;
    padding: 0 24px;
    text-align: center;
  }

  .kfv-showcase__tag {
    display: inline-block;
    background: var(--kfv-yellow);
    color: var(--kfv-ink);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 6px 16px;
    border-radius: 999px;
    transform: rotate(-2deg);
    margin-bottom: 14px;
  }

  .kfv-showcase__title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 4vw, 38px);
    color: var(--kfv-ink);
    line-height: 1.15;
    margin: 0 0 10px;
  }

  .kfv-showcase__title em {
    font-style: normal;
    color: var(--kfv-coral);
  }

  .kfv-showcase__sub {
    font-size: 16px;
    color: #6B5B4E;
    margin: 0;
  }

  .kfv-track-wrap {
    position: relative;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
  }

  .kfv-track {
    display: flex;
    width: max-content;
    gap: 24px;
    padding: 4px 12px;
    animation: kfv-scroll-right 34s linear infinite;
  }

  .kfv-track-wrap:hover .kfv-track {
    animation-play-state: paused;
  }

  .kfv-card {
    flex: 0 0 auto;
    width: 260px;
    background: #fff;
    border-radius: 22px;
    padding: 10px;
    box-shadow: 0 10px 24px rgba(59, 42, 32, 0.10);
    transform: rotate(var(--kfv-tilt, 0deg));
  }

  .kfv-card:nth-child(3n+1) { --kfv-tilt: -1.5deg; }
  .kfv-card:nth-child(3n+2) { --kfv-tilt: 1.2deg; }
  .kfv-card:nth-child(3n)   { --kfv-tilt: -0.6deg; }

  .kfv-card img {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 16px;
  }

  /* a anima&ccedil;&atilde;o percorre -50%, porque a lista de imagens est&aacute; duplicada
     logo abaixo, criando o efeito de loop infinito sem "salto" */
  @keyframes kfv-scroll-right {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0%); }
  }

  @media (max-width: 640px) {
    .kfv-card { width: 190px; }
    .kfv-card img { height: 190px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .kfv-track { animation: none; }
  }
</style>

<section class="kfv-showcase">
  <div class="kfv-showcase__head">
    <span class="kfv-showcase__tag">Chega prontinho na sua casa</span>
    <h2 class="kfv-showcase__title">Veja o que <em>voc&ecirc; recebe</em> ao comprar</h2>
    <p class="kfv-showcase__sub">Alguns dos temas j&aacute; montados por quem usou nossos arquivos</p>
  </div>

  <div class="kfv-track-wrap">
    <div class="kfv-track">
      <!-- conjunto 1 -->
      <div class="kfv-card"><img src="assets/carrossel/produto-1.png" alt="Kit de festa tema dinossauro"></div>
      <div class="kfv-card"><img src="assets/carrossel/produto-2.png" alt="Kit de festa tema Alice no Pa&iacute;s das Maravilhas"></div>
      <div class="kfv-card"><img src="assets/carrossel/produto-3.png" alt="Kit de festa tema Cocomelon"></div>
      <div class="kfv-card"><img src="assets/carrossel/produto-4.png" alt="Kit de festa tema Bluey"></div>
      <div class="kfv-card"><img src="assets/carrossel/produto-5.png" alt="Kit de festa tema Stitch"></div>
      <div class="kfv-card"><img src="assets/carrossel/produto-6.png" alt="Kit de festa tema Gabby's Dollhouse"></div>
      <div class="kfv-card"><img src="assets/carrossel/produto-7.png" alt="V&aacute;rios kits de festa tem&aacute;ticos montados por clientes"></div>
      <!-- conjunto 2, id&ecirc;ntico, para o loop ficar cont&iacute;nuo -->
      <div class="kfv-card" aria-hidden="true"><img src="assets/carrossel/produto-1.png" alt=""></div>
      <div class="kfv-card" aria-hidden="true"><img src="assets/carrossel/produto-2.png" alt=""></div>
      <div class="kfv-card" aria-hidden="true"><img src="assets/carrossel/produto-3.png" alt=""></div>
      <div class="kfv-card" aria-hidden="true"><img src="assets/carrossel/produto-4.png" alt=""></div>
      <div class="kfv-card" aria-hidden="true"><img src="assets/carrossel/produto-5.png" alt=""></div>
      <div class="kfv-card" aria-hidden="true"><img src="assets/carrossel/produto-6.png" alt=""></div>
      <div class="kfv-card" aria-hidden="true"><img src="assets/carrossel/produto-7.png" alt=""></div>
    </div>
  </div>
</section>
